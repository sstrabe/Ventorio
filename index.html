<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Ventorio</title>
        <link rel="icon" href="/icon.svg" type="image/svg+xml" />
        <link rel="icon" href="/favicon.ico" sizes="32x32" />
        <link rel="apple-touch-icon" href="/apple-icon.png" />
        <meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#141518" media="(prefers-color-scheme: dark)" />
        <script>
            // Apply the saved theme before the first paint, so nothing flashes.
            (function () {
                var match = document.cookie.match(/(?:^|; )theme=(light|dark)/);
                if (!match) return;
                document.documentElement.setAttribute("data-theme", match[1]);
                document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
                    meta.setAttribute("content", match[1] === "dark" ? "#141518" : "#f2f3f5");
                    meta.removeAttribute("media");
                });
            })();
        </script>
    </head>
    <body class="bg-page font-sans text-fg antialiased">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
